name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Run static checks
        run: python -m ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: python -m pip install 'build>=1,<2'
      - name: Build distributions
        run: python -m build
      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          expected_modules = {
              "__init__.py",
              "__main__.py",
              "annotate_plan.py",
              "cli.py",
              "config.py",
              "initialize.py",
              "worktrees.py",
          }
          expected_assets = {
              "assets/agent-skills/ollija/SKILL.md",
              "assets/agent-skills/ollija/agents/openai.yaml",
              "assets/templates/plan-guide.md",
          }
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          modules = {
              Path(name).name
              for name in names
              if name.startswith("ollija/") and name.endswith(".py")
          }
          assert modules == expected_modules
          assert {
              name for name in names if name.startswith("ollija/")
          } == {
              *(f"ollija/{name}" for name in expected_modules),
              *(f"ollija/{name}" for name in expected_assets),
          }
          metadata_roots = {
              name.split("/", 1)[0]
              for name in names
              if ".dist-info/" in name
          }
          assert len(metadata_roots) == 1
          metadata_root = metadata_roots.pop()
          assert all(
              name.startswith("ollija/") or name.startswith(f"{metadata_root}/")
              for name in names
          )

          source = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(source) as archive:
              members = archive.getmembers()
          roots = {member.name.split("/", 1)[0] for member in members}
          assert len(roots) == 1
          root = roots.pop()
          relative = {
              member.name.removeprefix(f"{root}/")
              for member in members
              if member.name != root and not member.isdir()
          }
          expected_source_modules = {f"src/ollija/{name}" for name in expected_modules}
          expected_source_assets = {f"src/ollija/{name}" for name in expected_assets}
          assert expected_source_modules <= relative
          allowed_files = {
              "CHANGELOG.md",
              "LICENSE",
              "MANIFEST.in",
              "PKG-INFO",
              "README.md",
              "pyproject.toml",
              "setup.cfg",
          }
          assert all(
              name in allowed_files
              or name in expected_source_modules
              or name in expected_source_assets
              or name.startswith("src/ollija.egg-info/")
              for name in relative
          )
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/ollija-smoke
          /tmp/ollija-smoke/bin/python -m pip install dist/*.whl
          /tmp/ollija-smoke/bin/ollija --help
          /tmp/ollija-smoke/bin/python -m ollija --help
          smoke_repo="$(mktemp -d)"
          git -C "$smoke_repo" init -b main
          git -C "$smoke_repo" config user.name "Example User"
          git -C "$smoke_repo" config user.email "example@example.invalid"
          touch "$smoke_repo/README.md"
          git -C "$smoke_repo" add README.md
          git -C "$smoke_repo" commit -m initial
          git -C "$smoke_repo" checkout -b feat/smoke
          git -C "$smoke_repo" remote add origin https://github.com/example/project.git
          (
            cd "$smoke_repo"
            /tmp/ollija-smoke/bin/ollija init --no-install-agent-skill
            /tmp/ollija-smoke/bin/ollija annotate-plan
            /tmp/ollija-smoke/bin/ollija annotate-plan --check
          )
